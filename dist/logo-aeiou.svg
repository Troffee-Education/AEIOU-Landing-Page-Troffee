<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="abBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004A97" />
      <stop offset="100%" stop-color="#002D62" />
    </linearGradient>
    <linearGradient id="abRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE2737" />
      <stop offset="100%" stop-color="#B31220" />
    </linearGradient>
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26522" />
      <stop offset="100%" stop-color="#E84A15" />
    </linearGradient>
    <linearGradient id="gradE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC20E" />
      <stop offset="100%" stop-color="#F39200" />
    </linearGradient>
    <linearGradient id="gradI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="100%" stop-color="#0072BC" />
    </linearGradient>
    <linearGradient id="gradO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70A86B" />
      <stop offset="100%" stop-color="#245B43" />
    </linearGradient>
    <linearGradient id="gradU" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92278F" />
      <stop offset="100%" stop-color="#662D91" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Alliance Bank Emblem & Text -->
  <g transform="translate(10, 10)">
    <!-- Red & Blue triangle emblem -->
    <path d="M0 16 L12 0 L18 8 L8 20 Z" fill="url(#abRed)" />
    <path d="M12 0 L24 16 L16 20 L8 8 Z" fill="url(#abBlue)" />
    <!-- Bank text -->
    <text x="28" y="14" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#004A97" letter-spacing="1.2">ALLIANCE BANK</text>
  </g>

  <!-- Main AEIOU Bubble Letters -->
  <g transform="translate(15, 34)" filter="url(#softGlow)">
    <!-- Letter A -->
    <g transform="translate(0, 0)">
      <path d="M18 42 L18 30 C18 12 34 2 48 2 C62 2 76 12 76 30 L76 42 C76 46 72 48 66 48 C60 48 58 44 58 40 L58 32 C58 24 54 18 47 18 C40 18 36 24 36 32 L36 40 C36 44 32 48 26 48 C20 48 18 44 18 42 Z" fill="url(#gradA)" />
      <path d="M26 30 L68 30 C71 30 73 33 73 36 C73 39 71 41 68 41 L26 41 C23 41 21 39 21 36 C21 33 23 30 26 30 Z" fill="#FCE4D6" />
      <!-- Sprout on A -->
      <path d="M47 3 C47 -8 38 -14 30 -14 C30 -5 38 2 47 3 Z" fill="#70A86B" />
      <path d="M47 3 C47 -6 56 -12 63 -11 C62 -2 55 2 47 3 Z" fill="#245B43" />
    </g>

    <!-- Letter E -->
    <g transform="translate(76, 0)">
      <path d="M16 8 C16 4 20 2 26 2 L62 2 C67 2 70 5 70 9 C70 13 67 16 62 16 L32 16 L32 20 L58 20 C63 20 66 23 66 27 C66 31 63 34 58 34 L32 34 L32 38 L64 38 C69 38 72 41 72 45 C72 49 69 52 64 52 L26 52 C20 52 16 48 16 42 Z" fill="url(#gradE)" />
      <!-- Blossom dot -->
      <circle cx="68" cy="8" r="4" fill="#F5CA67" />
    </g>

    <!-- Letter I -->
    <g transform="translate(148, 0)">
      <path d="M20 12 C20 6 25 2 31 2 C37 2 42 6 42 12 L42 42 C42 48 37 52 31 52 C25 52 20 48 20 42 Z" fill="url(#gradI)" />
      <!-- Little leaf top -->
      <circle cx="31" cy="-4" r="6" fill="#F5CA67" />
      <path d="M31 -4 C37 -10 46 -8 46 -2 C41 -1 35 -2 31 -4 Z" fill="#70A86B" />
    </g>

    <!-- Letter O -->
    <g transform="translate(204, 0)">
      <path d="M40 2 C58 2 72 13 72 27 C72 41 58 52 40 52 C22 52 8 41 8 27 C8 13 22 2 40 2 Z M40 16 C30 16 24 21 24 27 C24 33 30 38 40 38 C50 38 56 33 56 27 C56 21 50 16 40 16 Z" fill="url(#gradO)" />
      <!-- Seed center -->
      <path d="M40 20 C44 24 44 30 40 33 C36 30 36 24 40 20 Z" fill="#F5CA67" />
    </g>

    <!-- Letter U -->
    <g transform="translate(278, 0)">
      <path d="M16 8 C16 4 20 2 26 2 C32 2 36 5 36 9 L36 28 C36 35 40 38 46 38 C52 38 56 35 56 28 L56 9 C56 5 60 2 66 2 C72 2 76 4 76 8 L76 28 C76 43 64 52 46 52 C28 52 16 43 16 28 Z" fill="url(#gradU)" />
      <!-- Leaf on U -->
      <path d="M74 2 C82 -4 88 1 86 7 C80 6 76 5 74 2 Z" fill="#70A86B" />
    </g>
  </g>

  <!-- Tagline: SEEDS FOR LIFE -->
  <g transform="translate(130, 96)">
    <!-- Left Leaf -->
    <path d="M-18 2 C-26 -4 -28 -10 -22 -12 C-16 -12 -14 -6 -18 2 Z" fill="#70A86B" />
    <path d="M-12 3 C-16 -1 -17 -6 -13 -7 C-9 -7 -8 -3 -12 3 Z" fill="#245B43" />
    <!-- Text -->
    <text x="0" y="0" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#245B43" letter-spacing="3.5">SEEDS FOR LIFE</text>
    <text x="175" y="-1" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#EBA36B">S8</text>
    <!-- Right Leaf -->
    <path d="M214 2 C222 -4 224 -10 218 -12 C212 -12 210 -6 214 2 Z" fill="#70A86B" />
    <path d="M208 3 C212 -1 213 -6 209 -7 C205 -7 204 -3 208 3 Z" fill="#245B43" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pitchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#E8F3E5" />
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CA67" />
      <stop offset="100%" stop-color="#EBA36B" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70A86B" />
      <stop offset="100%" stop-color="#245B43" />
    </linearGradient>
    <filter id="pitchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#245B43" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Card Backdrop Shape -->
  <rect x="20" y="20" width="460" height="360" rx="36" fill="url(#pitchBg)" filter="url(#pitchShadow)" stroke="#B8D6B2" stroke-width="2" />

  <!-- Presentation Screen / Whiteboard -->
  <g transform="translate(65, 45)">
    <!-- Whiteboard Frame -->
    <rect x="15" y="15" width="260" height="175" rx="16" fill="#FFFFFF" stroke="#245B43" stroke-width="3" />
    <!-- Whiteboard clip top -->
    <rect x="115" y="6" width="60" height="18" rx="6" fill="#70A86B" />

    <!-- Growth Graph on screen -->
    <path d="M45 155 L45 50" stroke="#B8D6B2" stroke-width="2" stroke-linecap="round" />
    <path d="M45 155 L250 155" stroke="#B8D6B2" stroke-width="2" stroke-linecap="round" />
    <!-- Upward Trend Line -->
    <path d="M55 140 Q105 130 140 100 T230 55" stroke="#70A86B" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Graph Points -->
    <circle cx="55" cy="140" r="5" fill="#245B43" />
    <circle cx="105" cy="120" r="5" fill="#245B43" />
    <circle cx="155" cy="95" r="5" fill="#245B43" />
    <circle cx="230" cy="55" r="7" fill="#F5CA67" stroke="#245B43" stroke-width="2" />
    
    <!-- Mini Sprout at peak of graph -->
    <path d="M230 55 Q225 40 216 38 Q228 35 230 55 Z" fill="#70A86B" />
    <path d="M230 55 Q235 42 242 40 Q236 48 230 55 Z" fill="#245B43" />

    <!-- Bar columns -->
    <rect x="75" y="125" width="16" height="30" rx="4" fill="#B8D6B2" opacity="0.6" />
    <rect x="125" y="105" width="16" height="50" rx="4" fill="#70A86B" opacity="0.7" />
    <rect x="180" y="80" width="16" height="75" rx="4" fill="url(#chartGrad)" />
  </g>

  <!-- Glowing Idea Lightbulb with Sprout inside -->
  <g transform="translate(325, 45)">
    <!-- Glow rings -->
    <circle cx="55" cy="55" r="52" fill="#F5CA67" opacity="0.2" />
    <circle cx="55" cy="55" r="40" fill="url(#bulbGrad)" />
    <!-- Bulb shine -->
    <path d="M38 32 A 25 25 0 0 1 72 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none" />
    <!-- Sprout inside bulb -->
    <path d="M55 68 L55 45" stroke="#245B43" stroke-width="3" stroke-linecap="round" />
    <path d="M55 52 Q45 42 42 35 Q52 38 55 52 Z" fill="#245B43" />
    <path d="M55 48 Q65 40 68 35 Q60 42 55 48 Z" fill="#FFFFFF" />
    <!-- Bulb base -->
    <rect x="44" y="90" width="22" height="12" rx="3" fill="#26352B" />
    <rect x="47" y="104" width="16" height="6" rx="2" fill="#EBA36B" />
    <!-- Spark lines -->
    <line x1="55" y1="-2" x2="55" y2="8" stroke="#F5CA67" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="20" x2="18" y2="28" stroke="#F5CA67" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="20" x2="92" y2="28" stroke="#F5CA67" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Students Presenting & Prototyping -->
  <g transform="translate(60, 215)">
    <!-- Student 1 (Presenter with pointing gesture) -->
    <g transform="translate(40, 10)">
      <!-- Head -->
      <circle cx="35" cy="30" r="16" fill="#FCE4D6" />
      <!-- Hair -->
      <path d="M18 28 C18 12 32 8 46 12 C52 14 52 24 50 30 C46 22 38 20 28 22 Z" fill="#26352B" />
      <!-- Glasses -->
      <rect x="25" y="26" width="9" height="7" rx="2" stroke="#245B43" stroke-width="1.5" fill="none" />
      <rect x="37" y="26" width="9" height="7" rx="2" stroke="#245B43" stroke-width="1.5" fill="none" />
      <line x1="34" y1="29" x2="37" y2="29" stroke="#245B43" stroke-width="1.5" />
      <!-- Smile -->
      <path d="M30 38 Q35 42 40 38" stroke="#26352B" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Body (School uniform shirt & collar) -->
      <path d="M16 48 C16 45 54 45 54 48 L58 105 L12 105 Z" fill="#FFFFFF" stroke="#B8D6B2" stroke-width="1.5" />
      <!-- Tie / Collar -->
      <polygon points="35,46 39,58 35,70 31,58" fill="#245B43" />
      <polygon points="26,46 35,52 35,46" fill="#70A86B" />
      <polygon points="44,46 35,52 35,46" fill="#70A86B" />
      <!-- Pointing arm toward board -->
      <path d="M18 55 Q-2 40 -8 20" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
      <path d="M18 55 Q-2 40 -8 20" stroke="#B8D6B2" stroke-width="2" stroke-linecap="round" fill="none" />
      <circle cx="-9" cy="18" r="6" fill="#FCE4D6" />
    </g>

    <!-- Student 2 (Teammate with Prototype Model) -->
    <g transform="translate(145, 15)">
      <!-- Head -->
      <circle cx="35" cy="30" r="16" fill="#FCE4D6" />
      <!-- Ponytail hair -->
      <path d="M20 28 C20 12 50 12 50 28 C45 20 35 18 24 22 Z" fill="#26352B" />
      <path d="M18 26 C12 20 10 32 14 38 Z" fill="#26352B" />
      <!-- Face -->
      <circle cx="30" cy="28" r="2" fill="#26352B" />
      <circle cx="40" cy="28" r="2" fill="#26352B" />
      <path d="M32 36 Q35 39 38 36" stroke="#26352B" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- School attire -->
      <path d="M18 48 C18 45 52 45 52 48 L55 100 L15 100 Z" fill="#70A86B" />
      <!-- Collar -->
      <polygon points="30,46 35,54 40,46" fill="#FFFFFF" />
      <!-- Holding prototype table / box -->
      <g transform="translate(38, 48)">
        <!-- Eco prototype model -->
        <rect x="15" y="10" width="65" height="35" rx="6" fill="#FFF8E9" stroke="#EBA36B" stroke-width="2" />
        <!-- Miniature solar panel on prototype -->
        <polygon points="25,18 45,12 55,22 35,28" fill="#004A97" stroke="#0072BC" stroke-width="1" />
        <!-- Miniature wind turbine on prototype -->
        <line x1="65" y1="28" x2="65" y2="8" stroke="#26352B" stroke-width="2" />
        <circle cx="65" cy="8" r="3" fill="#F5CA67" />
        <line x1="65" y1="8" x2="57" y2="4" stroke="#70A86B" stroke-width="2" stroke-linecap="round" />
        <line x1="65" y1="8" x2="73" y2="4" stroke="#70A86B" stroke-width="2" stroke-linecap="round" />
        <line x1="65" y1="8" x2="65" y2="16" stroke="#70A86B" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Eco-Pitching Badge Bottom Right -->
  <g transform="translate(260, 310)">
    <circle cx="20" cy="20" r="22" fill="#FFF8E9" stroke="#245B43" stroke-width="3" />
    <!-- Gear & leaf icon inside -->
    <path d="M20 12 L20 28" stroke="#245B43" stroke-width="3" stroke-linecap="round" />
    <path d="M12 20 L28 20" stroke="#245B43" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="20" r="4" fill="#F5CA67" />
    <text x="52" y="18" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#245B43">ECO-PITCHING</text>
    <text x="52" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#70A86B">INNOVATION & SOLUTIONS</text>
  </g>
</svg>

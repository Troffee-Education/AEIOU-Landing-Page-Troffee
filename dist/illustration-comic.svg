<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#E8F3E5" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70A86B" />
      <stop offset="100%" stop-color="#245B43" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CA67" />
      <stop offset="100%" stop-color="#EBA36B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#245B43" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Card Backdrop Shape -->
  <rect x="20" y="20" width="460" height="360" rx="36" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#B8D6B2" stroke-width="2" />

  <!-- Sun with soft rays -->
  <circle cx="390" cy="90" r="42" fill="url(#sunGrad)" opacity="0.85" />
  <circle cx="390" cy="90" r="56" stroke="#F5CA67" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Comic Canvas / Easel -->
  <g transform="translate(60, 60)">
    <!-- Comic Book Board -->
    <rect x="30" y="30" width="240" height="170" rx="16" fill="#FFFFFF" stroke="#70A86B" stroke-width="3" />
    
    <!-- Comic Panels inside -->
    <rect x="45" y="45" width="100" height="65" rx="8" fill="#FFF8E9" stroke="#B8D6B2" stroke-width="2" />
    <!-- Panel 1: Sprout growing from coin -->
    <circle cx="95" cy="85" r="14" fill="#F5CA67" />
    <path d="M95 85 Q92 68 85 64 Q95 62 95 85 Z" fill="#245B43" />
    <path d="M95 85 Q98 70 105 66 Q98 64 95 85 Z" fill="#70A86B" />

    <!-- Panel 2: Happy earth with smile -->
    <rect x="155" y="45" width="100" height="65" rx="8" fill="#E8F3E5" stroke="#B8D6B2" stroke-width="2" />
    <circle cx="205" cy="78" r="22" fill="#70A86B" />
    <path d="M195 76 Q200 70 208 72 Q214 78 214 84" fill="#245B43" />
    <circle cx="198" cy="74" r="2.5" fill="#FFFFFF" />
    <circle cx="212" cy="74" r="2.5" fill="#FFFFFF" />
    <path d="M200 83 Q205 88 210 83" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Panel 3: Creative storyline with speech bubble -->
    <rect x="45" y="120" width="210" height="65" rx="8" fill="#FFF8E9" stroke="#B8D6B2" stroke-width="2" />
    <!-- Speech bubble -->
    <path d="M60 135 L120 135 Q130 135 130 145 L130 160 Q130 170 120 170 L80 170 L65 178 L70 170 L60 170 Q50 170 50 160 L50 145 Q50 135 60 135 Z" fill="#FFFFFF" stroke="#EBA36B" stroke-width="2" />
    <text x="62" y="156" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#245B43">GO GREEN!</text>
    
    <!-- Mini comic character sketching -->
    <circle cx="170" cy="148" r="14" fill="#FCE4D6" />
    <!-- Hair -->
    <path d="M156 145 C156 134 165 130 175 130 C185 130 186 138 184 148 C180 144 175 142 170 145 Z" fill="#26352B" />
    <circle cx="166" cy="146" r="1.5" fill="#26352B" />
    <circle cx="174" cy="146" r="1.5" fill="#26352B" />
    <path d="M168 152 Q170 155 173 152" stroke="#26352B" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <!-- Body -->
    <path d="M158 162 C158 158 182 158 182 162 L185 180 L155 180 Z" fill="#70A86B" />
  </g>

  <!-- Big Creative Tools (Color pencils, brush, palette) -->
  <g transform="translate(290, 190)">
    <!-- Palette -->
    <ellipse cx="60" cy="90" rx="65" ry="50" fill="#FFFFFF" stroke="#EBA36B" stroke-width="3" />
    <circle cx="30" cy="80" r="10" fill="#245B43" />
    <circle cx="55" cy="65" r="10" fill="#70A86B" />
    <circle cx="85" cy="70" r="10" fill="#F5CA67" />
    <circle cx="95" cy="98" r="10" fill="#EBA36B" />
    <circle cx="45" cy="110" r="10" fill="#92278F" />
    <!-- Thumb hole -->
    <ellipse cx="75" cy="115" rx="12" ry="8" fill="#FFF8E9" stroke="#EBA36B" stroke-width="2" />

    <!-- Paintbrush -->
    <g transform="translate(15, 20) rotate(-40)">
      <rect x="0" y="0" width="10" height="90" rx="4" fill="#26352B" />
      <path d="M-2 90 L12 90 L9 110 L1 110 Z" fill="#D3D3D3" />
      <path d="M1 110 L9 110 C9 125 5 130 5 130 C5 130 1 125 1 110 Z" fill="#70A86B" />
    </g>

    <!-- Pencil -->
    <g transform="translate(70, 10) rotate(25)">
      <polygon points="6,0 16,0 16,70 6,70" fill="#F5CA67" />
      <polygon points="6,70 16,70 11,88" fill="#FCE4D6" />
      <polygon points="9,82 13,82 11,88" fill="#26352B" />
      <rect x="6" y="0" width="10" height="12" fill="#EBA36B" />
    </g>
  </g>

  <!-- Lush Plants & Leaves around base -->
  <g transform="translate(30, 290)">
    <!-- Big green leaf -->
    <path d="M20 70 C10 30 60 10 90 20 C90 60 50 80 20 70 Z" fill="url(#leafGrad1)" />
    <!-- Second leaf -->
    <path d="M80 75 C100 35 150 40 160 65 C140 85 100 85 80 75 Z" fill="#70A86B" opacity="0.9" />
    <!-- Little sprout badge -->
    <circle cx="210" cy="50" r="24" fill="#FFF8E9" stroke="#70A86B" stroke-width="3" />
    <path d="M210 60 C210 46 202 40 196 38 C204 36 211 44 210 60 Z" fill="#245B43" />
    <path d="M210 56 C210 44 218 38 224 38 C218 44 212 50 210 56 Z" fill="#70A86B" />
    <text x="250" y="55" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#245B43">ECO-COMIC</text>
    <text x="250" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#70A86B">CREATIVE STORYTELLING</text>
  </g>
</svg>
